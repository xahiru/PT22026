# ---------------------------------------------------------------------------
# Model hyper-parameters. Each entry maps to a model in
# src/stockforecast/models.py. The LSTM section is only used when PyTorch is
# installed (see requirements-optional.txt); the app degrades gracefully to
# the scikit-learn models otherwise.
# ---------------------------------------------------------------------------

naive:
  enabled: true
  description: "Persistence baseline - predicts the last observed close price."

ridge:
  enabled: true
  alpha: 1.0

random_forest:
  enabled: true
  n_estimators: 300
  max_depth: 10
  min_samples_leaf: 5
  n_jobs: -1

gradient_boosting:
  enabled: true
  max_iter: 300
  learning_rate: 0.05
  max_depth: 3
  l2_regularization: 1.0

lstm:
  enabled: true
  seq_len: 20
  hidden_size: 64
  num_layers: 2
  dropout: 0.2
  epochs: 30
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 1.0e-4
