project:
  name: "Stock Price Forecasting"
  subtitle: "Next-day and short-horizon equity price prediction with classical ML and an LSTM"
  course: "Professional Training"
  course_code: "YN3012170034"
  student_name: "Joseph R Johnson"
  student_id: "20243120093"

data:
  default_ticker: "AAPL"
  period: "3y"            # yfinance look-back, e.g. 1y, 2y, 3y, 5y
  interval: "1d"          # daily bars
  train_split: 0.80       # time-ordered train/test split ratio
  random_state: 42
  min_rows: 80             # minimum bars required to train

features:
  lags: [1, 2, 3, 4, 5, 10, 20]
  sma_windows: [5, 20]
  ema_windows: [12, 26]
  rsi_window: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bollinger_window: 20
  volatility_window: 10

forecast:
  horizon: 5               # default recursive forecast horizon (trading days)
